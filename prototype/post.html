<body>

<div class="progress-bar" aria-hidden="true"><div class="progress-bar__fill"></div></div>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="index.html"><span class="site-logo__mark">W</span><span>向明笔记</span></a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="archive.html">归档</a>
      <a href="archive.html#categories">分类</a>
      <a href="about.html">关于</a>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="search.html" aria-label="搜索"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
      <button class="icon-btn" data-theme-toggle aria-label="切换主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="icon-btn nav-toggle" data-nav-open aria-label="打开菜单"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>
  </div>
</header>

<nav class="nav-drawer" aria-label="移动端导航">
  <button class="icon-btn nav-drawer__close" data-nav-close aria-label="关闭菜单"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <a href="index.html">首页</a><a href="archive.html">归档</a><a href="archive.html#categories">分类</a><a href="about.html">关于</a><a href="search.html">搜索</a>
</nav>

<main class="container" style="max-width:1100px;">
  <nav class="breadcrumb" aria-label="面包屑" data-render="breadcrumb"></nav>

  <div class="post-layout">
    <article>
      <header class="post-header" data-render="post-header"></header>

      <div class="post-content" data-render="post-content"></div>

      <nav class="post-nav" aria-label="上一篇 / 下一篇" data-render="post-nav"></nav>

      <section class="related">
        <h3 class="related__title">相关文章</h3>
        <div class="related__list" data-render="related"></div>
      </section>

      <div class="share-row">
        <button class="share-btn" data-share-copy>🔗 复制链接</button>
        <button class="share-btn" onclick="wbToast('微信扫码分享（演示）')">微信分享</button>
        <button class="share-btn" onclick="wbToast('已生成分享卡片（演示）')">生成分享卡片</button>
      </div>

      <section class="comments" id="comments">
        <h3 class="comments__title">评论（3）</h3>
        <div id="comment-list"></div>

        <form class="comment-form" id="comment-form" style="margin-top: var(--space-6);">
          <textarea placeholder="写下你的想法…（支持 Markdown）" aria-label="评论内容"></textarea>
          <div class="comment-form__row">
            <input name="nick" placeholder="昵称" aria-label="昵称">
            <input name="email" type="email" placeholder="邮箱（可选，用于接收回复通知）" aria-label="邮箱">
            <button class="btn btn--primary" type="submit">提交评论</button>
          </div>
        </form>
      </section>
    </article>

    <aside class="post-toc" aria-label="文章目录" data-render="toc">
      <p class="post-toc__title">目录</p>
    </aside>
  </div>
</main>

<button class="toc-fab" data-toc-open aria-label="打开目录">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
</button>
<div class="toc-drawer" aria-label="目录抽屉" data-render="toc-drawer"></div>

<footer class="site-footer">
  <div class="container">

    <p><a href="#" rel="nofollow">浙ICP备2026XXXXXX号-1</a></p>
  </div>
</footer>

</body>
</html>
