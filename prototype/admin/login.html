<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="wb-base" content="../">
<title>登录 — 向明笔记后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=2026100401">
<link rel="stylesheet" href="../assets/css/site.css?v=2026100401">
<link rel="stylesheet" href="../assets/css/admin.css?v=2026100401">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <a class="site-logo" href="../index.html"><span class="site-logo__mark">W</span><span>向明笔记 · 后台</span></a>

    <div class="lock-notice" id="login-lock" role="alert"></div>

    <form id="login-form" novalidate>
      <div id="step-password">
        <div class="form-field">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="form-error" id="login-error" role="alert"></p>
          <p class="form-hint" id="login-hint">演示提示：输入任意非空密码进入二次验证；输入 wrong 模拟失败（5 次触发锁定）。</p>
        </div>
        <button class="btn btn--primary btn--block" type="submit">登录</button>
      </div>

      <div id="step-totp" style="display:none;">
        <p style="text-align:center;font-size:var(--fs-small);color:var(--text-secondary);margin:0;">
          请输入身份验证器中的 6 位动态码<br><span class="form-hint" id="totp-hint">（演示：任意输入 6 位数字即进入后台）</span>
        </p>
        <div class="totp-row">
          <input inputmode="numeric" maxlength="1" aria-label="第 1 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 2 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 3 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 4 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 5 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 6 位">
        </div>
        <p class="form-hint" style="text-align:center;"><a href="#">收不到验证码？使用恢复码</a></p>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/site.js?v=2026100401"></script>
<script src="../assets/js/api.js?v=2026100401"></script>
<script src="../assets/js/admin.js?v=2026100401"></script>
</body>
</html>
