<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="wb-base" content="../">
<title>文章管理 — 向明笔记后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=2026100401">
<link rel="stylesheet" href="../assets/css/site.css?v=2026100401">
<link rel="stylesheet" href="../assets/css/admin.css?v=2026100401">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a class="site-logo" href="../index.html"><span class="site-logo__mark">W</span><span>向明笔记</span></a>
    <a class="admin-nav__item" href="index.html">▤ <span>看板</span></a>
    <a class="admin-nav__item is-active" href="posts.html">✎ <span>文章</span></a>
    <a class="admin-nav__item" href="editor.html">＋ <span>写文章</span></a>
    <a class="admin-nav__item" href="#">⌗ <span>分类标签</span></a>
    <a class="admin-nav__item" href="comments.html">◱ <span>评论</span><span class="admin-nav__badge">4</span></a>
    <a class="admin-nav__item" href="#">♺ <span>回收站</span></a>
    <a class="admin-nav__item" href="#">⚙ <span>设置</span></a>
        <a class="admin-nav__item" href="#" data-logout>⏻ <span>退出登录</span></a>
    <p class="admin-sidebar__foot">v1.0 · 备份正常</p>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <h1>文章管理</h1>
      <div class="admin-topbar__actions">
        <button class="icon-btn" data-theme-toggle aria-label="切换主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <a class="btn btn--primary" href="editor.html">＋ 写文章</a>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-toolbar">
        <input type="search" placeholder="搜索标题 / Slug…" aria-label="搜索文章">
        <select aria-label="状态筛选"><option>全部状态</option><option>已发布</option><option>草稿</option><option>定时发布</option></select>
        <select aria-label="分类筛选"><option>全部分类</option><option>前端</option><option>运维</option><option>随笔</option></select>
        <select aria-label="标签筛选"><option>全部标签</option><option>性能优化</option><option>Docker</option></select>
      </div>

      <div class="bulk-bar" id="bulk-bar">
        <strong id="bulk-count">已选 0 篇</strong>
        <button>改分类</button><button>加标签</button><button>批量发布</button>
        <button style="color:var(--error);">移入回收站</button>
      </div>

      <div class="panel" style="padding:0;overflow-x:auto;">
        <table class="data-table" id="posts-table">
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" aria-label="全选"></th>
              <th>标题</th><th>状态</th><th class="col-hide-m">分类 / 标签</th>
              <th class="col-hide-m">评论</th><th class="col-hide-m">更新时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody data-render="posts-tbody"></tbody>
        </table>
      </div>
      <p class="cell-meta" style="text-align:right;" data-render="posts-summary"></p>
    </div>
  </div>
</div>

<script src="../assets/js/site.js?v=2026100401"></script>
<script src="../assets/js/api.js?v=2026100401"></script>
<script src="../assets/js/admin.js?v=2026100401"></script>
<script src="../assets/js/admin-render.js?v=2026100401"></script>
</body>
</html>
