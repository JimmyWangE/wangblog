<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="wb-base" content="../">
<title>编辑器 — 向明笔记后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=2026100401">
<link rel="stylesheet" href="../assets/css/site.css?v=2026100401">
<link rel="stylesheet" href="../assets/css/admin.css?v=2026100401">
<link rel="stylesheet" href="../assets/vendor/editor/codemirror.css?v=2026100401">
<link rel="stylesheet" href="../assets/vendor/editor/foldgutter.css?v=2026100401">
<link rel="stylesheet" href="../assets/vendor/editor/hypermd-light.css?v=2026100401">
<link rel="stylesheet" href="../assets/vendor/editor/hypermd-mode.css?v=2026100401">
<style>html,body{height:100%;} .admin-shell--immersive{height:100vh;overflow:hidden;} .admin-main{height:100vh;overflow:hidden;display:flex;flex-direction:column;}</style>
</head>
<body>

<div class="admin-shell admin-shell--immersive">
  <div class="admin-main">
    <div class="editor-topbar">
      <a class="icon-btn" href="posts.html" aria-label="返回列表"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>
      <input class="editor-title-input" value="" placeholder="输入文章标题…" aria-label="文章标题">
      <span class="status-badge status-badge--draft">草稿</span>
      <span class="save-badge" id="save-badge"></span>
      <button class="btn btn--ghost" onclick="wbToast('历史版本时间线（演示）')">历史版本</button>
      <button class="btn btn--primary" data-publish>发布</button>
    </div>

    <div class="editor-toolbar" role="toolbar" aria-label="编辑工具">
      <button data-cmd="bold" title="加粗 (Ctrl/⌘+B)"><b>B</b></button>
      <button data-cmd="italic" title="斜体 (Ctrl/⌘+I)"><i>I</i></button>
      <button data-cmd="h2" title="标题 (Ctrl/⌘+1~6，再按一次取消)">H</button>
      <span class="sep"></span>
      <button data-cmd="link" title="插入链接 (Ctrl/⌘+K)">🔗</button>
      <button data-cmd="inlineCode" title="行内代码">&lt;/&gt;</button>
      <button data-cmd="codeBlock" title="代码块">{ }</button>
      <button data-cmd="quote" title="引用">❝</button>
      <span class="sep"></span>
      <button data-cmd="image" title="插入图片（也可直接 Ctrl+V 粘贴）">🖼</button>
      <button data-cmd="table" title="表格">▦</button>
      <button data-cmd="ul" title="无序列表">•</button>
      <button data-cmd="ol" title="有序列表">1.</button>
      <button data-cmd="task" title="任务列表">☑</button>
      <span class="sep"></span>
      <button data-cmd="toc" title="目录 TOC">≡</button>
      <button data-cmd="upload" title="上传图片（≤5MB，也可粘贴或拖拽）">上传图片</button>
      <span class="sep"></span>
      <button data-editor-mode="wysiwyg" aria-pressed="true">即时编辑</button>
      <button data-editor-mode="source" aria-pressed="false">Markdown</button>
      <button data-editor-mode="preview" aria-pressed="false">预览</button>
    </div>

    <input id="editor-image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" multiple hidden>
    <div id="editor-uploads" aria-live="polite" aria-label="图片上传状态" hidden></div>
    <div class="editor-split editor-split--wysiwyg">
      <div class="editor-pane">
<textarea id="md-editor" aria-label="Markdown 编辑区"></textarea>
      </div>
    </div>

    <details class="editor-settings">
      <summary>⚙ 文章设置 · Slug / 摘要 / 封面 / 分类 / 标签 / 定时发布</summary>
      <div class="settings-grid">
        <div class="form-field"><label>Slug</label><input data-field="slug" value=""><p class="form-hint">由标题自动生成，可修改，全站唯一</p></div>
        <div class="form-field"><label>分类</label><input data-field="category" value=""></div>
        <div class="form-field"><label>标签（逗号分隔）</label><input data-field="tags" value=""></div>
        <div class="form-field"><label>封面图</label><input placeholder="粘贴图片或点击上传 OSS"></div>
        <div class="form-field"><label>摘要</label><input data-field="excerpt" placeholder="留空则自动截取正文前 120 字"></div>
        <div class="form-field"><label>定时发布（可选）</label><input data-field="scheduledAt" type="datetime-local"></div>
      </div>
    </details>
  </div>
</div>

<div class="modal-mask" id="publish-modal" role="dialog" aria-modal="true" aria-labelledby="pub-h">
  <div class="modal">
    <h2 class="modal__title" id="pub-h">确认发布</h2>
    <div class="modal__row"><span>标题</span><strong id="pub-title"></strong></div>
    <div class="modal__row"><span>分类</span><span data-render="modal-category"></span></div>
    <div class="modal__row"><span>标签</span><span data-render="modal-tags"></span></div>
    <div class="modal__row"><span>发布方式</span><span>立即发布（可改为定时）</span></div>
    <p class="form-hint" style="margin-top:var(--space-3);">发布后将推送到 Git 仓库并触发 CI 构建，约 3 分钟内线上可见。</p>
    <div class="modal__actions">
      <button class="btn btn--ghost" data-modal-close>再改改</button>
      <button class="btn btn--primary" id="pub-confirm">确认发布</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="build-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 class="modal__title">正在构建与部署…</h2>
    <div class="build-steps">
      <div class="build-step"><span class="build-step__icon"></span>推送到 Git 仓库</div>
      <div class="build-step"><span class="build-step__icon"></span>渲染静态页面</div>
      <div class="build-step"><span class="build-step__icon"></span>生成 sitemap 与 RSS</div>
      <div class="build-step"><span class="build-step__icon"></span>重建搜索索引</div>
      <div class="build-step"><span class="build-step__icon"></span>部署到 ECS 并刷新 CDN</div>
    </div>
  </div>
</div>

<div class="modal-mask" id="done-modal" role="dialog" aria-modal="true">
  <div class="modal" style="text-align:center;">
    <div style="width:56px;height:56px;border-radius:50%;background:var(--success-soft);color:var(--success);display:grid;place-items:center;font-size:26px;margin:0 auto var(--space-4);">✓</div>
    <h2 class="modal__title">发布成功</h2>
    <p style="color:var(--text-secondary);font-size:var(--fs-small);">已提交 commit <code id="done-commit" style="font-family:var(--font-mono);">a3f9c21</code>（可回滚）</p>
    <div class="modal__actions" style="justify-content:center;">
      <button class="btn btn--ghost" data-modal-close>继续编辑</button>
      <a class="btn btn--primary" id="done-view-link" href="../post.html">查看文章</a>
    </div>
  </div>
</div>

<script src="../assets/vendor/editor/codemirror.js?v=2026100401"></script>
<script src="../assets/vendor/editor/foldcode.js?v=2026100401"></script>
<script src="../assets/vendor/editor/foldgutter.js?v=2026100401"></script>
<script src="../assets/vendor/editor/markdown-fold.js?v=2026100401"></script>
<script src="../assets/vendor/editor/closebrackets.js?v=2026100401"></script>
<script src="../assets/vendor/editor/markdown.js?v=2026100401"></script>
<script src="../assets/vendor/editor/meta.js?v=2026100401"></script>
<script src="../assets/vendor/editor/hypermd-ai1.js?v=2026100401"></script>
<script src="../assets/js/site.js?v=2026100401"></script>
<script src="../assets/js/api.js?v=2026100401"></script>
<script src="../assets/js/wysiwyg.js?v=2026100401"></script>
<script src="../assets/js/admin.js?v=2026100401"></script>
<script src="../assets/js/admin-render.js?v=2026100401"></script>
</body>
</html>
